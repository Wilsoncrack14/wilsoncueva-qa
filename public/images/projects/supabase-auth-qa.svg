<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Captura técnica de pruebas API y Autenticación para Supabase Auth">
  <rect width="800" height="450" fill="#080B0A"/>
  <rect x="20" y="20" width="760" height="410" rx="14" fill="#101513" stroke="#29332D" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="44" rx="14" fill="#151B18" stroke="#29332D" stroke-width="2"/>
  <circle cx="48" cy="42" r="6" fill="#EF4444"/>
  <circle cx="68" cy="42" r="6" fill="#F59E0B"/>
  <circle cx="88" cy="42" r="6" fill="#22C55E"/>
  <text x="115" y="47" fill="#A0AAA4" font-family="monospace" font-size="13">Supabase Auth — API &amp; Functional Security Testing (GoTrue JWT)</text>
  <rect x="560" y="30" width="200" height="24" rx="6" fill="#151B18" stroke="#F59E0B" stroke-width="1"/>
  <text x="574" y="46" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">PLAN · PENDIENTE EJECUCIÓN</text>

  <!-- Auth Flow Cards -->
  <rect x="48" y="88" width="220" height="125" rx="10" fill="#151B18" stroke="#29332D"/>
  <text x="66" y="116" fill="#B7FF35" font-family="monospace" font-size="12" font-weight="bold">POST /auth/v1/signup</text>
  <text x="66" y="144" fill="#F5F7F5" font-family="sans-serif" font-size="12">• Registro de usuario</text>
  <text x="66" y="168" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Reglas de contraseña</text>
  <text x="66" y="192" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Control de duplicados</text>

  <rect x="290" y="88" width="220" height="125" rx="10" fill="#151B18" stroke="#29332D"/>
  <text x="308" y="116" fill="#B7FF35" font-family="monospace" font-size="12" font-weight="bold">POST /auth/v1/token</text>
  <text x="308" y="144" fill="#F5F7F5" font-family="sans-serif" font-size="12">• Login &amp; Emisión JWT</text>
  <text x="308" y="168" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Persistencia de sesión</text>
  <text x="308" y="192" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Refresh &amp; Revocación</text>

  <rect x="532" y="88" width="220" height="125" rx="10" fill="#151B18" stroke="#29332D"/>
  <text x="550" y="116" fill="#EF4444" font-family="monospace" font-size="12" font-weight="bold">NEGATIVE &amp; SECURITY</text>
  <text x="550" y="144" fill="#F5F7F5" font-family="sans-serif" font-size="12">• Token manipulado (401)</text>
  <text x="550" y="168" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Credenciales erróneas</text>
  <text x="550" y="192" fill="#A0AAA4" font-family="sans-serif" font-size="12">• Rate Limit Brute-Force</text>

  <!-- JSON Contract Box -->
  <rect x="48" y="235" width="704" height="169" rx="10" fill="#080B0A" stroke="#29332D"/>
  <text x="70" y="266" fill="#B7FF35" font-family="monospace" font-size="12">// Validación de Contrato JSON y Casos Negativos (24 Casos Diseñados)</text>
  <text x="70" y="294" fill="#F5F7F5" font-family="monospace" font-size="12">expect(res.status).toBeOneOf([200, 400, 401, 422, 429]);</text>
  <text x="70" y="320" fill="#22C55E" font-family="monospace" font-size="12">expect(body).toMatchSchema({ access_token: 'jwt', token_type: 'bearer' });</text>
  <text x="70" y="346" fill="#F59E0B" font-family="monospace" font-size="12">Status: 24 Scenarios Documented · Pending Automated Execution</text>
  <text x="70" y="376" fill="#A0AAA4" font-family="monospace" font-size="12">Modules: Registro · Login · Formularios · Sesiones · API Auth · Negativos</text>
